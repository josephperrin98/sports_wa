# What I like to watch. app/preferences.py turns this into instructions for Claude.

# Replies cover today only, in this time zone (where I usually am): events live
# now or starting before midnight. Times carry the label so they're never ambiguous.
timezone = "America/New_York"
timezone_label = "ET"

# Men's teams and competitions only (Lyon means the men's team, not OL Lyonnes).
mens_only = true

# Events per reply (plus the wildcard), and at most this many from the same sport.
min_events = 3
max_events = 5
max_per_sport = 2

# Channels to list per event, main one first, so I have alternatives to try.
channels_per_event = 3

# Which language (and so which country's broadcasters) to search for each event.
# The first rule that applies wins. Any language is fine, even ones I don't speak.
language_rules = [
  "The language set for the team or competition in this list.",
  "Else the language of the league's own country (Serie A -> Italian). International competitions (Champions League, Europa League) have none, so go to the next rule.",
  "Else the home team's language (Inter v Club Brugge in Milan -> Italian, in Bruges -> Dutch).",
]

# Players come first in tennis in this order. Rankings change every week, so
# Claude looks the top 5 up live rather than this file naming them.
tennis_rule = "French players first, then the current ATP top 5 (men only)."

# Teams shown whenever they play, in any competition, above any tier.
